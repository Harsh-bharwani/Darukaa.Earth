name: Darukaa.Earth Continuous Integration

# Trigger this automated pipeline on any push or pull request to the main branches
on:
  push:
    branches: [ main, master, development ]
  pull_request:
    branches: [ main, master ]

jobs:
  code-quality:
    runs-on: ubuntu-latest

    steps:
    # 1. Pull down the codebase into the cloud runner workspace
    - name: Checkout Repository Source Code
      uses: actions/checkout@v4

    # 2. Set up a clean, reproducible Node environment for formatting checks
    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Frontend Quality Tools
      run: npm ci

    - name: Execute Prettier Formatting Verification
      run: npx prettier --check "backend/app/**/*.py" "package.json"

    # 3. Set up the Python execution container for the backend
    - name: Setup Python Runtime Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Backend Application Dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Core Syntax Compile Verification
      run: |
        cd backend
        python -m compileall app/
